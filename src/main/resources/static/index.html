<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Task Manager</h1><p class="subtitle">Java + Spring Boot + GitHub Copilot</p><section class="card"><h2>Nova tarefa</h2><form id="task-form"><input id="task-id" type="hidden"><label>Título<input id="title" required minlength="3" maxlength="100"></label><label>Descrição<textarea id="description" maxlength="500"></textarea></label><label>Status<select id="status"><option>PENDING</option><option>IN_PROGRESS</option><option>DONE</option></select></label><label>Prioridade<select id="priority"><option value="LOW">LOW</option><option value="MEDIUM" selected>MEDIUM</option><option value="HIGH">HIGH</option></select></label><div><button type="submit">Salvar</button><button type="button" id="cancel" class="secondary" hidden>Cancelar</button></div></form><p id="message" role="status"></p></section><section class="card"><div class="row"><h2>Tarefas</h2><button id="reload" class="secondary">Atualizar</button></div><div id="loading">Carregando...</div><ul id="tasks"></ul></section></main><script src="app.js"></script></body></html>
